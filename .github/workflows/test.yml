name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    # The development snapshot may break for reasons of its own.
    continue-on-error: ${{ matrix.emacs == 'snapshot' }}
    strategy:
      fail-fast: false
      matrix:
        # 30.1 is the oldest lispm-browser supports (Package-Requires).
        emacs: ['30.1', '30.2', '31.1', 'snapshot']
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - name: Byte-compile, warnings as errors
        run: make compile
      - name: Test
        run: make test

  extension-module:
    name: Extension module
    # WebKit's extension engine is macOS's own, so the extensions' module is
    # built and tested on a Mac.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: make webext
      - name: Test
        run: make webext-test
